<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-96.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kasir JE Grup" />
    <meta name="description" content="Sistem Kasir & Inventori JE Grup" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Kasir JE Grup</title>
    <style>
      body { margin: 0; background: #F4F5FA; }
      #splash {
        position: fixed; inset: 0; background: #232C75; color: #fff;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        z-index: 9999; transition: opacity .4s;
        font-family: 'Figtree Variable', Figtree, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash-mark { width: 64px; height: 64px; border-radius: 19px; background: #E9E1CC; color: #232C75;
        display: grid; place-items: center; font-weight: 800; font-size: 26px; letter-spacing: -.03em;
        padding-bottom: 6px; position: relative; overflow: hidden; margin-bottom: 18px; }
      #splash-mark::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 8px;
        background: repeating-linear-gradient(90deg, #A33A2D 0 4px, #232C75 4px 8px); }
      #splash-title { font-size: 24px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 6px; }
      #splash-sub { font-size: 14px; color: rgba(255,255,255,.7); }
      #splash-bar { margin-top: 28px; width: 120px; height: 3px; background: rgba(255,255,255,.18); border-radius: 2px; overflow: hidden; }
      #splash-progress { height: 100%; width: 0%; border-radius: 2px; background: #E9E1CC; animation: load 1.5s ease forwards; }
      @keyframes load { to { width: 100%; } }
    </style>
    <script type="module" crossorigin src="/assets/index-il2TK-P1.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Bxy0JztA.css">
  </head>
  <body>
    <div id="splash">
      <div id="splash-mark">JE</div>
      <div id="splash-title">Kasir JE Grup</div>
      <div id="splash-sub">Memuat aplikasi…</div>
      <div id="splash-bar"><div id="splash-progress"></div></div>
    </div>

    <div id="root"></div>

    <script>
      // ── Service Worker ─────────────────────────────────────────
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const reg = await navigator.serviceWorker.register('/sw.js', { scope: '/' });

            // Cek update setiap 60 detik (saat app aktif)
            setInterval(() => reg.update(), 60_000);

            // Update ditemukan → notif ke React
            const notifyUpdate = (sw) => {
              sw.addEventListener('statechange', () => {
                if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                  // Ada versi baru, simpan referensi SW baru
                  window.__pendingSW = sw;
                  // Panggil callback React jika sudah siap
                  window.__onUpdateReady?.();
                }
              });
            };

            // Cek apakah sudah ada SW baru yang menunggu
            if (reg.waiting) {
              window.__pendingSW = reg.waiting;
              window.__onUpdateReady?.();
            }

            reg.addEventListener('updatefound', () => {
              notifyUpdate(reg.installing);
            });

            // Setelah SW baru aktif → reload untuk pakai versi baru
            navigator.serviceWorker.addEventListener('controllerchange', () => {
              window.location.reload();
            });

          } catch(e) {
            console.warn('SW failed:', e);
          }
        });
      }

      // Fungsi untuk trigger update (dipanggil dari React)
      window.__applyUpdate = () => {
        if (window.__pendingSW) {
          window.__pendingSW.postMessage({ type: 'SKIP_WAITING' });
        } else {
          window.location.reload();
        }
      };

      // Hide splash
      window.__hideSplash = () => {
        const s = document.getElementById('splash');
        if (s) { s.classList.add('hide'); setTimeout(() => s.remove(), 500); }
      };
      setTimeout(() => window.__hideSplash?.(), 3000);
    </script>
  </body>
</html>
